<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevent theme flash -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("printopia-theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>

    <title>پرینتوپیا | فروشگاه محصولات چاپ سه‌بعدی و هدیه‌های شخصی‌سازی‌شده</title>
    <meta
      name="description"
      content="پرینتوپیا؛ فروشگاه تخصصی محصولات چاپ سه‌بعدی شامل اکشن فیگور، فیگور فانتزی، مجسمه و دکوری، گلدان، اکسسوری میز کار و هدیه‌های شخصی‌سازی‌شده با چاپ دقیق و متریال باکیفیت."
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://printopia.example/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="پرینتوپیا" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:title" content="پرینتوپیا | محصولات سه‌بعدی خاص، برای دنیای واقعی شما" />
    <meta
      property="og:description"
      content="از اکشن فیگورهای کلکسیونی تا هدیه‌های شخصی‌سازی‌شده؛ با دقت بالا و کیفیتی که دیده می‌شود."
    />
    <meta property="og:url" content="https://printopia.example/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="پرینتوپیا | چاپ سه‌بعدی پریمیوم" />
    <meta
      name="twitter:description"
      content="محصولات سه‌بعدی خاص، برای دنیای واقعی شما — اکشن فیگور، دکوری و هدیه‌های سفارشی."
    />

    <!-- Favicon (inline layered-cube mark) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d12'/%3E%3Cpath d='M16 5l9 5.2v10.6L16 26l-9-5.2V10.2z' fill='none' stroke='%238b5cf6' stroke-width='1.6'/%3E%3Cpath d='M16 5v10.4M16 15.4l9-5.2M16 15.4l-9-5.2' stroke='%2322d3ee' stroke-width='1.4' fill='none'/%3E%3C/svg%3E"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Base structured data: Organization + WebSite + SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://printopia.example/#organization",
            "name": "پرینتوپیا",
            "alternateName": "Printopia",
            "url": "https://printopia.example/",
            "logo": "https://printopia.example/logo.png",
            "description": "فروشگاه تخصصی محصولات چاپ سه‌بعدی و هدیه‌های شخصی‌سازی‌شده.",
            "slogan": "ایده‌ها را به واقعیت سه‌بعدی تبدیل می‌کنیم",
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+98-21-0000-0000",
              "contactType": "customer service",
              "areaServed": "IR",
              "availableLanguage": ["Persian"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://printopia.example/#website",
            "url": "https://printopia.example/",
            "name": "پرینتوپیا",
            "inLanguage": "fa-IR",
            "publisher": { "@id": "https://printopia.example/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://printopia.example/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
